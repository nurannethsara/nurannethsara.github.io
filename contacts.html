<!-- ── CONTACT ── -->
<section id="contact">
  <p class="section-label">Get In Touch</p>
  <h2 class="section-title">Let's talk.</h2>
  <div class="contact-wrap">
    <p class="contact-desc">
      I'm open to internships, freelance projects, and collaborations. 
      Feel free to reach out — I'd love to connect!
    </p>
    <form class="contact-form" onsubmit="handleSubmit(event)">
      <div class="form-row">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" placeholder="John Silva" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="john@example.com" required />
        </div>
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input type="text" placeholder="Project inquiry / Internship / Collaboration" />
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea rows="5" placeholder="Hi Nuran, I'd like to discuss..."></textarea>
      </div>
      <div>
        <button type="submit" class="btn-primary">Send Message →</button>
      </div>
      <p id="form-msg" style="font-size:0.875rem; color:var(--accent); display:none; margin-top:0.5rem;">✓ Message sent! (Connect a form service like Formspree to make this live.)</p>
    </form>
    <div class="contact-links">
      <a href="mailto:nurannethsara0665@gmail.com" class="contact-link">📧 nurannethsara0665@gmail.com</a>
      <a href="tel:+94759250291" class="contact-link">📞 +94 75 925 0291</a>
      <a href="https://github.com" target="_blank" class="contact-link">🐙 GitHub</a>
      <a href="https://linkedin.com" target="_blank" class="contact-link">💼 LinkedIn</a>
    </div>
  </div>
</section>
